<!DOCTYPE html>
<html>
<head>
    <title>ReservaFácil - Registro</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ReservaFácil</h1>
        <p class="subtitle">Crea tu cuenta</p>
    </div>

      <div id="mensaje"></div>
    
    <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const mensajeDiv = document.getElementById("mensaje");

    if (error === "1") {
        mensajeDiv.innerHTML = "No se pudo crear la cuenta. Verifica que las contraseñas coincidan o que el correo no esté registrado.";
        mensajeDiv.className = "alert error";
    }
    </script>
    
    <form action="registro" method="post">

        <input type="text" name="usuario" placeholder="Nombre completo" required>

        <input type="email" name="correo" placeholder="Correo electrónico" required>

        <input type="password" name="password" placeholder="Contraseña" required>

        <input type="password" name="confirmarPassword" placeholder="Confirmar contraseña" required>

        <button type="submit">Crear cuenta</button>

    </form>

    <div class="register-box">
        <span>¿Ya tienes cuenta?</span>
        <a class="register-btn" href="index.html">Inicia sesión</a>
    </div>

</div>
    
</body>
</html>
