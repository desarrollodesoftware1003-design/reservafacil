<!DOCTYPE html>
<html>
<head>
    <title>ReservaFácil - Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" href="styles.css" type="text/css"/>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ReservaFácil</h1>
        <p class="subtitle">Inicia sesión para continuar</p>
    </div>
    
        <div id="mensaje"></div>
    
    <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const mensajeDiv = document.getElementById("mensaje");

    if (error === "1") {
        mensajeDiv.innerHTML = "Correo o contraseña incorrectos.";
        mensajeDiv.className = "alert error";
    }
    </script>

    <form action="login" method="post">
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit">Ingresar</button>

        <div class="links">
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a></div>
    </form>

    <div class="register-box">
        <span>¿No tienes cuenta?</span>
        <a class="register-btn" href="registro.html">Crear cuenta</a>
    </div>

</div>

</body>
</html>
